name: Robô Papa Garimpou

on:
  # 20 execuções por dia; cada uma posta em 1 canal (o que tiver menos posts hoje) = ~600 min/mês do grátis (2.000/mês).
  # Horários em UTC; em Brasília (UTC-3): 08:07 08:52 09:38 10:24 11:11 11:56 12:19 12:47 13:22 14:08 15:03 15:51 16:44 17:36 18:09 18:42 19:17 20:03 20:38 21:24
  schedule:
    - cron: "7 11 * * *"
    - cron: "52 11 * * *"
    - cron: "38 12 * * *"
    - cron: "24 13 * * *"
    - cron: "11 14 * * *"
    - cron: "56 14 * * *"
    - cron: "19 15 * * *"
    - cron: "47 15 * * *"
    - cron: "22 16 * * *"
    - cron: "8 17 * * *"
    - cron: "3 18 * * *"
    - cron: "51 18 * * *"
    - cron: "44 19 * * *"
    - cron: "36 20 * * *"
    - cron: "9 21 * * *"
    - cron: "42 21 * * *"
    - cron: "17 22 * * *"
    - cron: "3 23 * * *"
    - cron: "38 23 * * *"
    - cron: "24 0 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal = postar; verificar = só confere o bot, não posta"
        default: "normal"
        type: choice
        options: [normal, verificar, story_teste]

permissions:
  contents: write

concurrency:
  group: robo-papa
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Identidade do git (para publicar as artes)
        run: |
          git config user.name "robo-papa"
          git config user.email "robo-papa@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodar robô
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ALERTA_CHAT_ID: ${{ secrets.ALERTA_CHAT_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            verificar) python principal.py --verificar ;;
            story_teste) python principal.py --story-teste ;;
            *) python principal.py ;;
          esac
      - name: Guardar histórico (evita repetir produto)
        if: always()
        run: |
          git config user.name "robo-papa"
          git config user.email "robo-papa@users.noreply.github.com"
          git add dados/historico.json dados/relatorio.json midia 2>/dev/null || true
          git add -u midia 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "histórico" && git push)
