name: Guardião do robô

# Reserva do agendamento: o "schedule" do GitHub às vezes atrasa ou pula horários.
# O guardião fica de olho nos mesmos horários do robo.yml; se 10 min depois o robô
# não rodou, ele dispara o robô. Cada volta dura ~5h45 e, no fim, chama a próxima.
# Repositório público = minutos do Actions grátis.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 */6 * * *"   # re-arma o guardião se a corrente parar

permissions:
  actions: write
  contents: read

concurrency:
  group: guardiao
  cancel-in-progress: true

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Vigiar horários do robô
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERTA_CHAT_ID: ${{ secrets.ALERTA_CHAT_ID }}
        run: |
          # 05/11 (dono: "100% automático e se monitorar sozinho"): vigia de fora do robô. A cada 30 min, 8h-22h
          # (Brasília): sem execução do robô criada há mais de 60 min e nenhuma rodando/na fila -> dispara;
          # nenhuma execução TERMINADA há mais de 90 min, ou disparo que falhou -> avisa o dono (1 vez a cada 3 h).
          avisar() {
            [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$ALERTA_CHAT_ID" ] &&               curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"                 --data-urlencode "chat_id=$ALERTA_CHAT_ID" --data-urlencode "text=$1"
          }
          ultimo_aviso=0
          proxima_checagem=0
          checar_robo() {
            hora=$(TZ=America/Sao_Paulo date +%H)
            [ "$hora" -ge 8 ] && [ "$hora" -lt 22 ] || return 0
            runs=$(gh api "repos/$REPO/actions/workflows/robo.yml/runs?per_page=10")
            criado=$(echo "$runs" | jq -r '.workflow_runs[0].created_at')
            ativos=$(echo "$runs" | jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')
            fim_ok=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.status=="completed")][0].updated_at')
            agora_s=$(date +%s)
            if [ "$ativos" = "0" ] && [ $(( agora_s - $(date -d "$criado" +%s) )) -gt 3600 ]; then
              if gh workflow run robo.yml -R "$REPO" -f modo=normal; then
                echo "vigia: robô parado desde $criado, disparei"
              elif [ "$ultimo_aviso" = "0" ]; then
                # 12/11 (dono: "me avisa toda hora"): só o que o dono resolve (GitHub não deixa disparar), 1 vez por volta
                avisar "⚠️ Robô Papa Garimpou parado e o guardião não conseguiu disparar. Abrir o GitHub Actions." && ultimo_aviso=$agora_s
              fi
            fi
            # 12/11: "sem terminar há 90 min" não vai mais para o dono (o guardião já dispara de novo); fica só no log
            if [ $(( agora_s - $(date -d "$fim_ok" +%s) )) -gt 5400 ]; then
              echo "vigia: robô sem terminar uma execução há mais de 90 min (última: $fim_ok)"
            fi
          }
          # 05/11 (1 ano sem o dono): o GitHub desliga o "schedule" de repositório sem atividade por 60 dias.
          # Os commits de histórico do robô já contam como atividade; por garantia, religa os dois workflows a cada volta.
          for w in robo.yml guardiao.yml; do gh api -X PUT "repos/$REPO/actions/workflows/$w/enable" >/dev/null 2>&1 || true; done
          # Mesmos horários (UTC, HHMM) do robo.yml
          SLOTS="1107 1152 1238 1324 1411 1456 1519 1547 1622 1708 1803 1851 1944 2036 2109 2142 2217 2303 2338 0024"
          fim=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            agora=$(date -u +%H%M)
            for s in $SLOTS; do
              if [ "$agora" = "$s" ]; then
                sleep 600
                ult=$(gh api "repos/$REPO/actions/workflows/robo.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at')
                if [ $(( $(date +%s) - $(date -d "$ult" +%s) )) -gt 900 ]; then
                  gh workflow run robo.yml -R "$REPO" -f modo=normal && echo "$s: agendamento falhou, disparei o robô"
                else
                  echo "$s: robô já rodou"
                fi
              fi
            done
            if [ "$(date +%s)" -ge "$proxima_checagem" ]; then
              checar_robo || true
              proxima_checagem=$(( $(date +%s) + 1800 ))
            fi
            sleep 50
          done
      - name: Passar o bastão para a próxima volta
        if: ${{ !cancelled() }}   # se foi cancelado por outra volta, não duplica a corrente
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run guardiao.yml -R "${{ github.repository }}"
